# monitoring/docker-compose.yml
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090" # Porta do Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml # Mapeia o arquivo de configuração
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Porta do Grafana UI
    volumes:
      - grafana-storage:/var/lib/grafana # Persistência de dados do Grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin # Altere para uma senha forte em produção!
    restart: unless-stopped
    depends_on:
      - prometheus # Garante que o Prometheus inicie antes do Grafana

volumes:
  grafana-storage: