# monitoring/prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] 
  
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9000']
    metrics_path: '/metrics'

  - job_name: 'users-service'
    static_configs:
      - targets: ['users-service:9001']
    metrics_path: '/metrics'

  - job_name: 'pricing-service'
    static_configs:
      - targets: ['pricing-service:9002']
    metrics_path: '/metrics'

  - job_name: 'orders-service'
    static_configs:
      - targets: ['orders-service:9003']
    metrics_path: '/metrics'

